name: terraform-deploy

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the Terraform changes
        required: false
        default: "false"
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_IN_AUTOMATION: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Lambda package
        run: |
          mkdir -p dist
          cd src/functions/image_processor
          zip -r ../../../dist/image-processor.zip .

      - name: Build Pillow layer
        run: |
          python -m pip install --upgrade pip
          mkdir -p build/pillow/python dist
          python -m pip install -r src/layers/pillow/requirements.txt -t build/pillow/python
          cd build/pillow
          zip -r ../../dist/pillow-layer.zip python

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform -chdir=terraform fmt -check

      - name: Terraform init
        run: terraform -chdir=terraform init

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Terraform plan
        run: |
          terraform -chdir=terraform plan \
            -var="aws_region=${AWS_REGION}" \
            -var="lambda_zip_path=../dist/image-processor.zip" \
            -var="pillow_layer_zip=../dist/pillow-layer.zip"

      - name: Terraform apply
        if: github.ref == 'refs/heads/main' || github.event.inputs.apply == 'true'
        run: |
          terraform -chdir=terraform apply -auto-approve \
            -var="aws_region=${AWS_REGION}" \
            -var="lambda_zip_path=../dist/image-processor.zip" \
            -var="pillow_layer_zip=../dist/pillow-layer.zip"
