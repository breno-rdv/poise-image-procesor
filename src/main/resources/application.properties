# Lambda handler name (matches @Named on SQSLambdaHandler)
quarkus.lambda.handler=image-processor

# Bucket / table names injected as Lambda environment variables by Terraform
app.raw-bucket=${RAW_BUCKET:poise-image-processor-raw}
app.thumbnails-bucket=${THUMBNAILS_BUCKET:poise-image-processor-thumbnails}
app.dynamodb-table=${DYNAMODB_TABLE:poise-image-processor-metadata}

# AWS region injected by Lambda runtime; falls back to us-east-1
app.aws.region=${AWS_REGION_NAME:us-east-1}

# LocalStack (dev profile) — endpoint override enables local testing
%dev.app.aws.endpoint-override=http://localhost:4566

# Native image: initialize AWS SDK retry/backoff classes at run time (hold java.util.Random in static fields)
# Also initialize AWT SunHints at build time (quarkus-awt does not cover these for GraalVM 25)
quarkus.native.additional-build-args=\
  --initialize-at-run-time=software.amazon.awssdk.core.retry.backoff.FullJitterBackoffStrategy\\,software.amazon.awssdk.services.dynamodb.DynamoDbRetryPolicy,\
  --initialize-at-build-time=sun.awt.SunHints\\,sun.awt.SunHints$Key\\,sun.awt.SunHints$Value\\,sun.awt.SunHints$LCDContrastKey\\,sun.java2d
